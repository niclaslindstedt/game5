         one labelled contact sheet. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b1116;
      }
      #stage {
        position: absolute;
        left: -10000px;
      }
      #sheet {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="sheet"></canvas>
    <script type="module" src="/src/tools/cloud-harness.ts"></script>
