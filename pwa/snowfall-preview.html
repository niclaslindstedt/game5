<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Snowfall preview harness</title>
    <!-- Tooling page for scripts/snowfall-preview.mjs — not part of the app
         build (vite builds only index.html) and never deployed. It rides the
         seed's meadow at a ladder of speeds under every falling sky and
         photographs the snow streaming past the lens, as a labelled
         contact sheet. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b1116;
      }
      #stage {
        position: absolute;
        left: -10000px;
      }
      #sheet {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="sheet"></canvas>
    <script type="module" src="/src/tools/snowfall-harness.ts"></script>
  </body>
</html>
