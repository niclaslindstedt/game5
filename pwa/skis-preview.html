<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Skis preview harness</title>
    <!-- Tooling page for scripts/skis-preview.mjs — not part of the app
         build (vite builds only index.html) and never deployed. It builds
         every pair and its skier with the game's own builder and draws
         them on a labelled contact sheet: pairs by views, poses by views,
         a landing as a time-lapse. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1116;
        overflow: auto;
      }
      canvas {
        display: block;
      }
      #sheet {
        position: relative;
        display: inline-block;
      }
      .label {
        position: absolute;
        color: #fff;
        font: 12px/1.3 monospace;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 3px rgb(0 0 0 / 85%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="sheet"><canvas id="stage"></canvas></div>
    <script type="module" src="/src/tools/skis-harness.ts"></script>
  </body>
</html>
