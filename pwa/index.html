<!doctype html>
<!-- SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is a game, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the game paint under the
         notch / home indicator (the HUD pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Fall Line</title>
    <!-- THIS BUILD IS NOT INDEXED. The web deploy is a free, incomplete cut of
         the game and is not the copy a search engine should hand anybody, so
         the page carries no crawlable description of itself: no meta
         description, no canonical, no sitemap link, no Open Graph or Twitter
         card, no JSON-LD, and no prerendered body copy. `robots.txt` says the
         same thing at the origin, and `tests/identity_test.ts` holds this
         head to it — a discovery tag added back here fails that test.
         The title is the app's name alone because a browser tab and an
         installed launcher both need one. -->
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The brand colour is the night (BRAND_COLOR, PALETTE.night in
         src/identity.ts, restated here because a static head cannot import
         it; the manifest the build emits carries the same value). One
         night, either scheme: the game paints its own canvas and does not
         have a light look. The page is painted it before the stylesheet
         arrives, so the first frame of a boot is never a white flash. -->
    <meta name="theme-color" content="#0a1726" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1726" media="(prefers-color-scheme: dark)" />
    <style>
      html {
        background: #0a1726;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Fall Line needs JavaScript and WebGL2 to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
