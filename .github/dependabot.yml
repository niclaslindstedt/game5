# Dependency hygiene (OSS_GAME_SPEC §14): one entry per ecosystem the repo
# actually uses. npm covers the root workspace and the pwa workspace (npm
# workspaces resolve through the root lockfile); github-actions covers every
# `uses:` in .github/workflows/.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only, and its plugin
      # refuses to load under TS 7, so `make lint` cannot pass on it yet.
      # Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
