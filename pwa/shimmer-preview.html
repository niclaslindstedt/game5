<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Shimmer preview harness</title>
    <!-- Tooling page for scripts/shimmer-preview.mjs — not part of the app
         build (vite builds only index.html) and never deployed. It slides a
         lens a few centimetres a frame past the far faces of the mountain
         and measures how much of the picture flickers from one frame to the
         next, as a labelled contact sheet and a table. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b1116;
      }
      #stage {
        position: absolute;
        left: -10000px;
      }
      #sheet {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="sheet"></canvas>
    <script type="module" src="/src/tools/shimmer-harness.ts"></script>
  </body>
</html>
